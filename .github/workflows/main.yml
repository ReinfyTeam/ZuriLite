name: Build and validate plugin
on:
  push:
  workflow_dispatch:
jobs:
 build-phar:
   name: Build and validate plugin
   runs-on: ubuntu-latest
   steps:
     - name: Check out repository source
       uses: actions/checkout@v4
     - name: Download PHP runtime binaries
       run: "curl -sL https://github.com/pmmp/PHP-Binaries/releases/download/php-build-524/PHP-8.4-Linux-x86_64-PM5.tar.gz -o php.tar.gz"
     - name: Extract PHP runtime binaries
       run: "tar -xvzf php.tar.gz"
     - name: Make PHP runtime executable
       run: "chmod +x ./bin/php7/bin/php"
     - name: Configure the OPcache extension path
       run: EXTENSION_DIR=$(find "$(pwd)/bin" -name "*debug-zts*") \
            grep -q '^extension_dir' bin/php7/bin/php.ini && sed -i'bak' "s{^extension_dir=.*{extension_dir=\"$EXTENSION_DIR\"{" bin/php7/bin/php.ini || echo "extension_dir=\"$EXTENSION_DIR\"" >> bin/php7/bin/php.ini
     - name: Download PHP-CS-Fixer
       run: "curl -sL https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/latest/download/php-cs-fixer.phar -o php-cs-fixer.phar"
     - name: Apply PHP code style
       run: "./bin/php7/bin/php php-cs-fixer.phar fix src"
     - name: Build plugin PHAR
       run: "./bin/php7/bin/php -dphar.readonly=0 tools/build.php"
     - name: Upload plugin PHAR artifact
       uses: actions/upload-artifact@v4
       with:
          name: ZuriLite.phar
          path: ZuriLite.phar
     - name: Remove temporary build files
       run: "rm -rf *"
